name: Bravo PostgreSQL integration

on:
  pull_request:
    paths:
      - 'nova/backend/**'
      - 'nova/frontend/**'
      - '.github/workflows/bravo-postgres-integration.yml'

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bravo_ci
          POSTGRES_USER: bravo_ci
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bravo_ci -d bravo_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://bravo_ci:local-ci-only@127.0.0.1:5432/bravo_ci
      SECRET_KEY: github-ci-bravo-test-token-not-for-production
      ENVIRONMENT: test
      PYTHONDONTWRITEBYTECODE: '1'
      BRAVO_POSTGRES_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies and test transport
        run: |
          python -m pip install -r nova/backend/requirements.txt
          python -m pip install httpx==0.28.1
      - name: Check Alembic graph and apply all migrations on empty PostgreSQL
        working-directory: nova/backend
        run: |
          alembic heads
          alembic upgrade head
          alembic current
      - name: Exercise Bravo orders, prices and Nova isolation over real PostgreSQL
        working-directory: nova/backend
        run: python -m unittest discover -s tests -p 'test_bravo_postgres_integration.py' -v
