name: Bravo PostgreSQL integration

on:
  pull_request:
    paths:
      - 'nova/backend/**'
      - 'nova/frontend/**'
      - '.github/workflows/bravo-postgres-integration.yml'

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bravo_ci
          POSTGRES_USER: bravo_ci
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bravo_ci -d bravo_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://bravo_ci:local-ci-only@127.0.0.1:5432/bravo_ci
      SECRET_KEY: github-ci-bravo-test-token-not-for-production
      ENVIRONMENT: test
      PYTHONDONTWRITEBYTECODE: '1'
      BRAVO_POSTGRES_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies and test transport
        run: |
          python -m pip install -r nova/backend/requirements.txt
          python -m pip install httpx==0.28.1
      - name: Check Alembic graph and apply all migrations on empty PostgreSQL
        working-directory: nova/backend
        run: |
          alembic heads
          alembic upgrade head
          alembic current
      - name: Exercise Bravo orders, prices and Nova isolation over real PostgreSQL
        working-directory: nova/backend
        run: python -m unittest discover -s tests -p 'test_bravo_postgres_integration.py' -v

  browser-responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nova/frontend/package-lock.json
      - name: Install frontend and test-only browser runner
        working-directory: nova/frontend
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
      - name: Install Chromium for isolated browser tests
        working-directory: nova/frontend
        run: npx playwright install --with-deps chromium
      - name: Start frontend preview server
        working-directory: nova/frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 >/tmp/bravo-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/bravo-vite.log
          exit 1
      - name: Check responsive widths and multiproduct form
        working-directory: nova/frontend
        run: node tests/bravo-responsive.mjs
      - name: Attach screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bravo-responsive-screenshots
          path: nova/frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
