name: Bravo checks

on:
  pull_request:
    paths:
      - 'nova/backend/**'
      - 'nova/frontend/**'
      - '.github/workflows/bravo-checks.yml'

jobs:
  backend-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r nova/backend/requirements.txt
      - name: Verify Python syntax
        run: python -m compileall -q nova/backend/app nova/backend/alembic
      - name: Run Bravo contract checks
        working-directory: nova/backend
        run: python -m unittest discover -s tests -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nova/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: nova/frontend
        run: npm ci
      - name: Build frontend
        working-directory: nova/frontend
        run: npm run build
